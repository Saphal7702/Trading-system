[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading"
version = "0.1.0"
description = "Personal trading system (Phase 1)"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv==1.0.1",
  "requests>=2.31",
  "pytz",
  "reportlab",
  "alpaca-py==0.28.0",
]

[project.scripts]
trading = "trading.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]